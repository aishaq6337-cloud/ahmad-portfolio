<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Me | Ahmad Ishaq</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>Contact Me</h1>
    <p>Get in touch with me</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="about.html">About Me</a>
    <a href="projects.html">Projects</a>
    <a href="planner.html">Academic Planner</a>
    <a href="contact.html">Contact</a>
</nav>

<main>
    <section>
        <h2>Send Me a Message</h2>

        <form id="contactForm">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your full name">

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email">

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">

            <label for="message">Message:</label>
            <textarea id="message" name="message" placeholder="Write your message"></textarea>

            <button type="submit">Submit Message</button>
        </form>

        <p id="formMessage"></p>
    </section>
</main>

<footer>
    <p>&copy; 2026 Ahmad Ishaq. All Rights Reserved.</p>
</footer>

<script>
const contactForm = document.getElementById("contactForm");
const formMessage = document.getElementById("formMessage");

contactForm.addEventListener("submit", function(event) {
    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const message = document.getElementById("message").value.trim();

    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const phonePattern = /^\d+$/;

    if (!name || !email || !phone || !message) {
        formMessage.textContent = "Please fill in all fields.";
        return;
    }

    if (!emailPattern.test(email)) {
        formMessage.textContent = "Please enter a valid email address.";
        return;
    }

    if (!phonePattern.test(phone)) {
        formMessage.textContent = "Phone number must contain digits only.";
        return;
    }

    formMessage.textContent = "Your form has been validated successfully!";
    contactForm.reset();
});
</script>

</body>
</html>
